[workspace]
members = [".", "xtask"]

# Debug info is most of what a build leaves on disk. Line tables keep file
# and line numbers in panics and backtraces; dependencies get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[package]
name = "project-transfer"
version = "0.1.54"
edition = "2024"
description = "Mirror project folders between computers on a LAN"

[lib]
name = "project_transfer"
path = "src/lib.rs"

[[bin]]
name = "project-transfer"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
rfd = "0.17"
mdns-sd = "0.21"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
blake3 = "1"
ignore = "0.4"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
filetime = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
sha2 = "0.10"
tokio-util = "0.7"
anyhow = "1"
thiserror = "2"
gethostname = "1"
if-addrs = "0.15"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu", "eframe"] }
tempfile = "3"
# A paused clock lets tests cover long waits without waiting.
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
all = "warn"

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration-sys = "0.6"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
